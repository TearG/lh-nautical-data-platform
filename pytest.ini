# pytest.ini
# =============================================================================
# Configuração global do pytest para o projeto LH Nautical.
# Gabriel Santos: "Cada falha deve ser clara sobre o que quebrou e por quê."
# =============================================================================

[pytest]
# Descobre todos os testes na pasta tests/
testpaths = tests

# Exibe saída verbosa com nomes dos testes e resultados claros
addopts =
    --verbose
    --tb=short
    --no-header
    -p no:warnings
    --color=yes

# Marcadores customizados para filtrar testes por severidade
markers =
    p0: Crítico — falha bloqueia o pipeline (schema, PKs, integridade)
    p1: Alto — impacta análises de negócio (preços, margens, NF-e)
    p2: Médio — anomalias temporais e cadastrais
    p3: Baixo — melhorias de qualidade de dados
    bronze: Testa os dados brutos (CSVs originais)
    silver: Testa as tabelas processadas pelo nosso pipeline
    gold:   Testa os relatórios e KPIs gerados
